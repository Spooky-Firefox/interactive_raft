# k3s ships Traefik as its ingress controller; cert-manager issues the TLS cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interactive-raft
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: raft.ronstad.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: interactive-raft
                port:
                  name: http
  tls:
    - hosts:
        - raft.ronstad.se
      secretName: interactive-raft-tls
