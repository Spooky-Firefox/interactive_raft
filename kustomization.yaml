# Root kustomization: ArgoCD points at the repo root (path ".").
# It lives here (not in deploy/) because kustomize can only read files
# inside its own directory, and the ConfigMap is generated from site/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: interactive-raft
labels:
  - pairs:
      app.kubernetes.io/name: interactive-raft
    includeSelectors: true
resources:
  - deploy/deployment.yaml
  - deploy/service.yaml
  - deploy/ingress.yaml
configMapGenerator:
  # Name gets a content hash suffix, so editing any site file rolls the Deployment.
  - name: interactive-raft-html
    files:
      - site/index.html
      - site/sandbox.html
      - site/raft.css
      - site/raft-sim.js
      - site/raft-view.js
      - site/slides.js
      - site/deck.js
